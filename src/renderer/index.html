<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>linloop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <div class="bar">
        <div class="drag-space" aria-hidden="true"></div>
        <button id="speak-input" class="speech hidden" title="Pronounce input" aria-label="Pronounce input" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4.5 10H2v4h2.5L9 17V7Z"/><path d="M13 8.5a5 5 0 0 1 0 7M16 5.5a9 9 0 0 1 0 13"/></svg></button>
        <button id="gear" class="icon" title="Settings" aria-label="Settings">⚙</button>
      </div>
      <div class="writing-area">
        <div id="input-preview" class="markdown hidden" role="button" tabindex="0" aria-label="Edit your writing"></div>
        <textarea id="input" rows="4" autocomplete="off" spellcheck="false" aria-label="Your writing"></textarea>
      </div>
      <div id="status" role="status" class="status hidden"></div>
      <div id="dictionary" class="dictionary hidden"></div>
      <div id="assist" class="assist hidden">
        <section id="grammar-section" class="output-section">
          <div class="section-title markdown" data-markdown="## Grammar"></div>
          <div id="grammar-results" class="list"></div>
        </section>
        <section id="refine-section" class="output-section">
          <div class="section-title markdown" data-markdown="## Refine"></div>
          <div id="refine-results" class="list"></div>
        </section>
      </div>
      <div id="settings" class="settings hidden">
        <label>Hotkey <input id="hotkey" readonly aria-describedby="hotkey-hint" /></label>
        <div id="hotkey-hint" class="settings-hint" role="status">Click the field, then press a key combination. Press Escape to cancel.</div>
        <button id="hotkey-reset" type="button" class="ghost">Use default hotkey</button>
        <label>Model <input id="model" list="ai-models" autocomplete="off" /></label>
        <datalist id="ai-models">
          <option value="mlx-community/Qwen2.5-0.5B-Instruct-4bit">Qwen2.5 0.5B · MLX · Apple Silicon</option>
          <option value="qwen2.5:0.5b">Qwen2.5 0.5B · Ollama</option>
          <option value="mlx-community/Qwen3-0.6B-4bit">Qwen3 0.6B · MLX · Apple Silicon</option>
          <option value="qwen3:0.6b">Qwen3 0.6B · Ollama</option>
        </datalist>
        <div class="ai-setup">
          <div id="ai-status" role="status" aria-live="polite"></div>
          <button id="ai-install" type="button">Install and download</button>
        </div>
        <label class="check"><input id="dictionary-first" type="checkbox" /> macOS Dictionary first (English only)</label>
        <label>Paper
          <div class="modes" id="theme-modes">
            <button type="button" class="mode theme on" data-theme="auto">Cream</button>
            <button type="button" class="mode theme" data-theme="dark">Dark</button>
            <button type="button" class="mode theme" data-theme="light">White</button>
          </div>
        </label>
        <div class="settings-actions">
          <button id="settings-close" class="ghost">Close</button>
          <button id="settings-save">Save</button>
        </div>
      </div>
      <div id="model-note" class="model-note hidden"></div>
    </div>
    <script src="markdown.js"></script>
    <script src="app.js"></script>
  </body>
</html>
