name: Release Windows

on:
  push:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows release
        run: bun run dist:win

      - name: Upload release assets
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path dist -Filter "Linloop-Setup-*.exe"
          gh release upload $env:RELEASE_TAG $assets.FullName --clobber
