name: Release Builds

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or v0.1.0). Defaults to package.json when empty."
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="$(node -p "require('./package.json').version")"
          fi

          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RAW"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (package version ${VERSION})"

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh api "/repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method POST "/repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --draft --generate-notes \
              --target "$GITHUB_SHA" --title "Linloop ${RELEASE_VERSION}" "${flags[@]}"
          fi

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply release version
        run: bun scripts/set-version.ts "${{ env.RELEASE_VERSION }}"

      - name: Build macOS release
        run: bun run dist:mac --universal

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.dmg --clobber

  publish:
    needs: [resolve-version, build-macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Publish completed release
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          echo "$assets" | grep -Fx "Linloop-${RELEASE_VERSION}-mac.dmg"
          gh release edit "$RELEASE_TAG" --draft=false --title "Linloop ${RELEASE_VERSION}"
