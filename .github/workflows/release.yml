name: Release Builds

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or v0.1.0). Defaults to package.json when empty."
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="$(node -p "require('./package.json').version")"
          fi

          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RAW"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (package version ${VERSION})"

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply release version
        run: bun scripts/set-version.ts "$RELEASE_VERSION"

      - name: Build macOS release
        run: bun run dist:mac

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: macos-release-assets
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply release version
        run: bun scripts/set-version.ts "$RELEASE_VERSION"

      - name: Build Windows release
        run: bun run dist:win

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-release-assets
          path: dist/Linloop-Setup-*.exe
          if-no-files-found: error

  publish:
    needs: [resolve-version, build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true

      - name: Ensure version tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if gh api "/repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists on origin"
          else
            gh api \
              --method POST \
              "/repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}"
            echo "Created tag ${RELEASE_TAG} at ${GITHUB_SHA}"
          fi

      - name: Create release and upload assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "Linloop ${RELEASE_VERSION}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Linloop ${RELEASE_VERSION}" \
              --generate-notes
          fi
